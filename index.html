<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeVi</title>
    <style>
      :root {
        --bg: #0f1419;
        --fg: #e8eef4;
        --muted: #8b9aab;
        --accent: #3d9cf0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(ellipse 80% 60% at 50% -10%, #1a3a5c 0%, transparent 55%),
          var(--bg);
        color: var(--fg);
      }

      main {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        margin-bottom: 0.75rem;
      }

      p {
        color: var(--muted);
        font-size: 1.1rem;
        max-width: 28rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GeVi</h1>
      <p>Workspace siap. Mulai pengembangan di sini.</p>
    </main>
  </body>
</html>
