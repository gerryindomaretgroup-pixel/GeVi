<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2f33" />
    <meta name="description" content="Kartu ucapan ulang tahun interaktif dari GeVi" />
    <meta property="og:title" content="GeVi — Kartu Ulang Tahun" />
    <meta property="og:description" content="Buka kartu ucapan ulang tahun interaktif: pesan, foto, video, dan musik." />
    <meta property="og:type" content="website" />
    <title>GeVi — Kartu Ulang Tahun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
      <canvas id="sparkles" class="sparkles"></canvas>
    </div>

    <!-- LAYAR PEMBUKA -->
    <section id="intro" class="intro" aria-label="Pembuka kartu">
      <p class="brand">GeVi</p>
      <h1 class="intro-title">Untukmu</h1>
      <p class="intro-sub">Sebuah kartu ulang tahun kecil yang bisa kamu buka di sini.</p>
      <button type="button" id="open-card" class="btn-open">
        Buka kartu
      </button>
    </section>

    <!-- ISI KARTU -->
    <main id="card" class="card-flow" hidden>
      <header class="hero-message">
        <p class="brand brand-sm">GeVi</p>
        <h2 id="recipient-name" class="recipient">Happy Birthday</h2>
        <p id="main-message" class="message"></p>
      </header>

      <section class="media-block" aria-labelledby="photos-title">
        <h3 id="photos-title" class="section-title">Kenangan</h3>
        <p class="section-sub">Geser untuk melihat foto</p>
        <div class="gallery" id="gallery" role="region" aria-roledescription="carousel"></div>
        <div class="gallery-dots" id="gallery-dots" aria-hidden="true"></div>
      </section>

      <section class="media-block" aria-labelledby="video-title">
        <h3 id="video-title" class="section-title">Video</h3>
        <p class="section-sub">Tekan play untuk menonton</p>
        <div class="video-frame">
          <video
            id="birthday-video"
            controls
            playsinline
            preload="metadata"
            poster=""
          >
            Browser kamu tidak mendukung video.
          </video>
        </div>
      </section>

      <section class="media-block wish-block" aria-labelledby="wish-title">
        <h3 id="wish-title" class="section-title">Pesan</h3>
        <p id="wish-text" class="wish-text"></p>
      </section>

      <footer class="closing">
        <p class="closing-brand">GeVi</p>
        <p class="closing-note">Dibuat dengan cinta untuk hari spesialmu.</p>
      </footer>
    </main>

    <!-- KONTROL MUSIK -->
    <div id="music-bar" class="music-bar" hidden>
      <button type="button" id="music-toggle" class="music-toggle" aria-pressed="false" aria-label="Putar musik">
        <span class="music-icon" aria-hidden="true"></span>
        <span class="music-label">Musik</span>
      </button>
      <audio id="bg-music" loop preload="auto"></audio>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
